<svg xmlns="http://www.w3.org/2000/svg" width="540" height="60" viewBox="0 0 540 60">
  <!--
    Marker confetti borrowed from the camp's hand-drawn "Admin!" staff poster.
    Kept in reserve as accents for specific elements, not as background decoration.
    Each mark is a symbol drawn in a 24-unit box centred on 0,0 and coloured by currentColor.
    Use: <svg width="22" height="22" style="color:#1A8B5A"><use href="assets/poster-confetti.svg#squiggle"/></svg>
    Poster colours: brand #1A8B5A, accent #F2B93D (stars), secondary #7CBBDD, peach #F49E6C, ink #1C3B2C.
    Order in the preview row: squiggle, curl, arc, square, ring, dash, zigzag, star, dot.
  -->
  <defs>
    <symbol id="squiggle" viewBox="-12 -12 24 24"><path d="M-9 2C-7.5-2.5-4.5-3-3 0S1.5 3.5 3 .5 7.5-2.5 9-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="curl" viewBox="-12 -12 24 24"><path d="M-9 4C-5 4 1-1 0-4-1-7-5-5-3-1-1 3 5 3 9 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="arc" viewBox="-12 -12 24 24"><path d="M4-4C0-7-6-4-5 1-4 5 1 6 4 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="square" viewBox="-12 -12 24 24"><path d="M-5-5.2 5.3-4.6 4.8 5.2-5.2 4.7Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ring" viewBox="-12 -12 24 24"><path d="M4.6-2.2A5 5 0 1 1 1.5-4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="dash" viewBox="-12 -12 24 24"><path d="M-6 1 6-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="zigzag" viewBox="-12 -12 24 24"><path d="M-8 2.5-4-2.5 0 2.5 4-2.5 8 2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="star" viewBox="-12 -12 24 24"><path d="M0-9 2.35-3.24 8.56-2.78 3.8 1.24 5.29 7.28 0 4-5.29 7.28-3.8 1.24-8.56-2.78-2.35-3.24Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="dot" viewBox="-12 -12 24 24"><path d="M3 0A3 3 0 1 1-3 0 3 3 0 1 1 3 0Z" fill="currentColor"/></symbol>
  </defs>
  <rect width="540" height="60" fill="#F1E7CE"/>
  <use href="#squiggle" x="12" y="12" width="36" height="36" style="color:#1A8B5A"/>
  <use href="#curl" x="72" y="12" width="36" height="36" style="color:#F49E6C"/>
  <use href="#arc" x="132" y="12" width="36" height="36" style="color:#7CBBDD"/>
  <use href="#square" x="192" y="12" width="36" height="36" style="color:#7CBBDD"/>
  <use href="#ring" x="252" y="12" width="36" height="36" style="color:#F49E6C"/>
  <use href="#dash" x="312" y="12" width="36" height="36" style="color:#1C3B2C"/>
  <use href="#zigzag" x="372" y="12" width="36" height="36" style="color:#1A8B5A"/>
  <use href="#star" x="432" y="12" width="36" height="36" style="color:#F2B93D"/>
  <use href="#dot" x="492" y="12" width="36" height="36" style="color:#1A8B5A"/>
</svg>
