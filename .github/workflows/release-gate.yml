name: Release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The build reads live Sanity content, so a content edit can turn main red
  # with no push. The nightly run finds that before an unrelated pull request
  # does.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'Setebaid Services' }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
  NEXT_PUBLIC_STUDIO_URL: ${{ vars.NEXT_PUBLIC_STUDIO_URL || 'http://localhost:3333' }}
  NEXT_PUBLIC_SITE_ENV: production
  NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2026-03-23' }}
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'o36mi5w4' }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
  OG_IMAGE_SECRET: ci-only-og-image-secret
  SANITY_STUDIO_TITLE: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'Setebaid Services' }}
  SANITY_STUDIO_PREVIEW_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
  SANITY_STUDIO_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2026-03-23' }}
  SANITY_STUDIO_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'o36mi5w4' }}
  SANITY_STUDIO_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
  SANITY_STUDIO_HOSTNAME: ci-setebaid

jobs:
  scope:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests that touch only documentation skip the code jobs below.
      # Pushes to main and manual runs always run everything.
      - name: Decide whether the change needs the code gate
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # `shell: bash` adds pipefail, so a failed page of the file list fails
        # this job instead of classifying a partial list.
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request; running the code gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXPECTED_FILES="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')"
          export EXPECTED_FILES
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' \
            | node scripts/gate-scope.mjs

  static:
    name: Static checks
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated types, TypeScript, lint, and unit tests
        run: pnpm verify:static

  build:
    name: Build and smoke
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build both apps and run the smoke suite
        run: pnpm verify:build

  # The one check the main branch ruleset requires. It passes when every code
  # job passed or was skipped for a documentation-only pull request.
  release-gate:
    name: Release gate
    needs: [scope, static, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate job to pass or be skipped
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "scope=$SCOPE_RESULT static=$STATIC_RESULT build=$BUILD_RESULT"
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::Classifying the change ended with '$SCOPE_RESULT'."
            exit 1
          fi
          for result in "$STATIC_RESULT" "$BUILD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A gate job ended with '$result'."
                exit 1
                ;;
            esac
          done

  # A red main blocks every pull request. Say so in one place: an open issue
  # labelled main-red, with one comment for each further failed run.
  alert:
    name: Report a red main
    needs: release-gate
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Open or update the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          body="The release gate failed on main ($EVENT_NAME run): $RUN_URL"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label main-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label main-red \
              --title "Main is red: the release gate fails" \
              --body "$body Close this issue when main is green again."
          fi
